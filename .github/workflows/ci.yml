name: Stock Management CI and Jira Automation

on:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven tests
        working-directory: backend
        run: mvn --batch-mode clean test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  jira-transition:
    name: Move Jira issue to Done after successful push
    needs: [backend, frontend]
    if: >-
      success() &&
      github.event_name == 'push' &&
      vars.JIRA_TRANSITIONS_ENABLED == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Find Jira issue key
        id: issue
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          issue_key="$(printf '%s\n' "$BRANCH_NAME" "$COMMIT_MESSAGE" \
            | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1 || true)"

          if [[ -z "$issue_key" ]]; then
            echo "No Jira issue key found. Skipping Jira update."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found Jira issue: $issue_key"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "key=$issue_key" >> "$GITHUB_OUTPUT"
          fi

      - name: Move Jira issue to Done
        if: steps.issue.outputs.found == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.issue.outputs.key }}

        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$JIRA_BASE_URL" || -z "$JIRA_USER_EMAIL" || -z "$JIRA_API_TOKEN" ]]; then
            echo "::error::Configure JIRA_BASE_URL, JIRA_USER_EMAIL, and JIRA_API_TOKEN repository secrets."
            exit 1
          fi

          BASE_URL="${JIRA_BASE_URL%/}"

          echo "Checking available Jira transitions for $ISSUE_KEY..."

          TRANSITIONS="$(curl --fail-with-body --silent --show-error \
            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "$BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions")"

          TRANSITION_ID="$(jq -r '
            .transitions[]
            | select((.to.name | ascii_downcase) == "done")
            | .id
          ' <<< "$TRANSITIONS" | head -n 1)"

          if [[ -z "$TRANSITION_ID" ]]; then
            echo "::error::No available transition to Done for $ISSUE_KEY."
            echo "Check the Jira workflow and permissions."
            exit 1
          fi

          echo "Moving $ISSUE_KEY to Done..."

          curl --fail-with-body --silent --show-error \
            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            --header "Content-Type: application/json" \
            --request POST \
            --data "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" \
            "$BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions"

          echo "Successfully moved $ISSUE_KEY to Done."
