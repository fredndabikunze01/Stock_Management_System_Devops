name: Stock Management CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run Maven tests
        working-directory: backend
        run: mvn --batch-mode clean test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  jira-transition:
    name: Transition Jira issue after successful merge
    needs: [backend, frontend]
    if: >-
      success() &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      vars.JIRA_TRANSITIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Find Jira issue key from merged pull request
        id: issue
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          issue_key="$(printf '%s\n' "$PR_TITLE" "$HEAD_REF" "$PR_BODY" \
            | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1 || true)"
          if [[ -z "$issue_key" ]]; then
            echo "::error::No Jira issue key found in the PR title, branch, or description."
            exit 1
          fi
          echo "key=$issue_key" >> "$GITHUB_OUTPUT"

      - name: Move Jira issue to Done
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.issue.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$JIRA_BASE_URL" || -z "$JIRA_USER_EMAIL" || -z "$JIRA_API_TOKEN" ]]; then
            echo "::error::Configure JIRA_BASE_URL, JIRA_USER_EMAIL, and JIRA_API_TOKEN repository secrets."
            exit 1
          fi

          base_url="${JIRA_BASE_URL%/}"
          transitions="$(curl --fail-with-body --silent --show-error \
            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "$base_url/rest/api/3/issue/$ISSUE_KEY/transitions")"
          transition_id="$(jq -r \
            '.transitions[] | select((.to.name | ascii_downcase) == "done") | .id' \
            <<< "$transitions" | head -n 1)"

          if [[ -z "$transition_id" ]]; then
            echo "::error::No available transition to a status named Done for $ISSUE_KEY."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            --header "Content-Type: application/json" \
            --request POST \
            --data "{\"transition\":{\"id\":\"$transition_id\"}}" \
            "$base_url/rest/api/3/issue/$ISSUE_KEY/transitions"
